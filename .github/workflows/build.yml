name: Build Only

on:
  push:
    branches:
      - main # or whichever branch you want
  pull_request: # optional: build on PRs too
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        run: npm install
        working-directory: client

      - name: Build frontend
        run: npm run build
        working-directory: client

      - name: Prepare icon folder
        shell: bash
        run: |
          mkdir -p build-icons
          cp client/public/icon-512.png build-icons/icon.png

      - name: Generate icon (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          if [ ! -f client/public/icon.ico ]; then
            magick client/public/icon.png -resize 256x256 client/public/icon.ico
          fi

      - name: Generate icon (macOS)
        if: runner.os == 'macOS'
        run: |
          if [ ! -f client/public/icon.icns ]; then
            mkdir icon.iconset
            sips -z 16 16     client/public/icon.png --out icon.iconset/icon_16x16.png
            sips -z 32 32     client/public/icon.png --out icon.iconset/icon_16x16@2x.png
            sips -z 32 32     client/public/icon.png --out icon.iconset/icon_32x32.png
            sips -z 64 64     client/public/icon.png --out icon.iconset/icon_32x32@2x.png
            sips -z 128 128   client/public/icon.png --out icon.iconset/icon_128x128.png
            sips -z 256 256   client/public/icon.png --out icon.iconset/icon_128x128@2x.png
            sips -z 256 256   client/public/icon.png --out icon.iconset/icon_256x256.png
            sips -z 512 512   client/public/icon.png --out icon.iconset/icon_256x256@2x.png
            sips -z 512 512   client/public/icon.png --out icon.iconset/icon_512x512.png
            iconutil -c icns icon.iconset -o client/public/icon.icns
          fi

      - name: Build executable (Mac/Linux)
        if: runner.os != 'Windows'
        run: |
          # pick icns on mac, png on linux
          if [ "$RUNNER_OS" = "macOS" ]; then
            ICON="build-icons/icon.icns"
          else
            ICON="build-icons/icon.png"
          fi
          uv run pyinstaller --onefile \
            --add-data "server/static:static" \
            --icon "$ICON" \
            --name "pebble" \
            server/main.py

      - name: Build executable (Windows)
        if: runner.os == 'Windows'
        run: uv run pyinstaller --onefile --add-data "server/static;static"  --icon "build-icons/icon.ico" --name pebble server/main.py

      - name: Prepare artifacts per OS
        run: |
          mkdir upload
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp dist/*.exe upload/pebble-$RUNNER_OS.exe
          else
            cp dist/* upload/pebble-$RUNNER_OS
          fi
        shell: bash

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: upload/*
